name: zeppay
description: Offline-first UPI payments — scan, confirm, pay.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  # 7.x uses Apple Vision on iOS (no GoogleMLKit), so it no longer clashes
  # with google_mlkit_text_recognition's MLKitVision 10.x pods.
  mobile_scanner: ^7.2.0
  local_auth: ^2.3.0
  permission_handler: ^11.4.0
  http: ^1.3.0
  intl: ^0.20.2
  uuid: ^4.5.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  fl_chart: ^0.70.2
  csv: ^6.0.0
  audioplayers: ^6.4.0
  flutter_contacts: ^1.1.9+2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  collection: ^1.19.1
  crypto: ^3.0.6
  share_plus: ^10.1.4
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/lottie/
