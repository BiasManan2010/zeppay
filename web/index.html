<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Zep Pay — scan a UPI QR, confirm, pay.">

  <!-- iOS home-screen PWA (Safari → Share → Add to Home Screen) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zep Pay">
  <link rel="apple-touch-icon" href="favicon.png">
  <meta name="theme-color" content="#1C1C1E">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta http-equiv="Permissions-Policy" content="camera=(self)">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Zep Pay</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
    window.zepDecodeQr = function (imageData) {
      if (!window.jsQR) return null;
      var code = jsQR(imageData.data, imageData.width, imageData.height);
      return code ? { data: code.data } : null;
    };
  </script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #1C1C1E;
    }
    /* Camera sits under Flutter; the scan window is a transparent hole. */
    #zep-cam-host {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: #000;
      pointer-events: none;
    }
    #zep-cam-host video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }
    flutter-view,
    flt-glass-pane,
    flt-scene-host,
    flt-semantics-host {
      position: relative;
      z-index: 1;
      background: transparent !important;
    }
    body.zep-scanning {
      background: #000;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
