<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Zep Pay — scan a UPI QR, confirm, pay.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zep Pay">
  <link rel="apple-touch-icon" href="favicon.png">
  <meta name="theme-color" content="#1C1C1E">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta http-equiv="Permissions-Policy" content="camera=(self)">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Zep Pay</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
    (function () {
      function decodeImageData(imageData) {
        if (!window.jsQR || !imageData) return null;
        var code = jsQR(imageData.data, imageData.width, imageData.height);
        return code ? { data: code.data } : null;
      }

      window.zepDecodeQr = function (imageData) {
        return decodeImageData(imageData);
      };

      window.zepDecodeImageUrl = function (url) {
        return new Promise(function (resolve) {
          var img = new Image();
          img.onload = function () {
            try {
              var w = img.naturalWidth || img.width;
              var h = img.naturalHeight || img.height;
              if (!w || !h) {
                resolve(null);
                return;
              }
              var max = 1280;
              var scale = Math.min(1, max / Math.max(w, h));
              var cw = Math.max(1, Math.round(w * scale));
              var ch = Math.max(1, Math.round(h * scale));
              var canvas = document.createElement('canvas');
              canvas.width = cw;
              canvas.height = ch;
              var ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, cw, ch);
              resolve(decodeImageData(ctx.getImageData(0, 0, cw, ch)));
            } catch (e) {
              resolve(null);
            }
          };
          img.onerror = function () { resolve(null); };
          img.crossOrigin = 'anonymous';
          img.src = url;
        });
      };

      window.zepDecodeImageUrlCb = function (url, onOk) {
        window.zepDecodeImageUrl(url).then(function (result) { onOk(result); });
      };
    })();
  </script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #1C1C1E;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
