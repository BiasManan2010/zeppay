name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          TWILIO_VERIFY_URL: ${{ secrets.TWILIO_VERIFY_URL }}
        run: flutter build apk --release --no-shrink --dart-define=TWILIO_VERIFY_URL=${TWILIO_VERIFY_URL}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeppay-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Zep Pay Android ${{ github.run_number }}
          body: |
            Sideload this APK on an Android phone for the hackathon demo.

            1. Download `app-release.apk`
            2. Enable Install unknown apps for Chrome/Files
            3. Open the APK and install
            4. If Twilio Verify is configured, use the SMS code. Otherwise OTP is **123456**
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
